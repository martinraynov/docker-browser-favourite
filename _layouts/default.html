<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
    <link rel="alternate icon" type="image/png" href="{{ '/favicon.svg' | relative_url }}">

{% seo %}
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" type="text/css" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" crossorigin>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000B36">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/dashboard.css?v=' | append: site.github.build_revision | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/links.css?v=' | append: site.github.build_revision | relative_url }}">
  </head>
  <body class="dashboard-body">
    <a id="skip-to-content" href="#content">Skip to the content.</a>

    {% include sidebar.html %}

    <div class="dashboard-main">
      <main id="content" class="dashboard-content" role="main">
        {{ content }}

        <footer class="site-footer">
          {% include footer-credits.html %}
        </footer>
      </main>
    </div>
  </body>
</html>
